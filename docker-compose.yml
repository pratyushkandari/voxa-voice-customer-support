# Local / single-host deployment of the full stack.
# Optional overrides go in a root-level .env file (read by Compose for ${VAR} substitution):
#   JWT_SECRET_KEY            stable signing key (unset => random per gateway start)
#   SEED_ADMIN_PASSWORD       password for the seeded admin@voxa.ai account (first start only)
#   POSTGRES_PASSWORD         database password (first start only: it is stored in the volume)
#   CORS_ALLOW_ORIGIN_REGEX   browser origins allowed to call the API (default: localhost)
#   GEMINI_API_KEY            Gemini API key (unset => replies use the router's plain text)
#   GEMINI_MODEL              Gemini model (default: gemini-3.6-flash)
#   NEXT_PUBLIC_API_URL       gateway URL as seen by the BROWSER (baked into the frontend build)
#
# Only the frontend (3000) and the gateway (8088) are published on every interface.
# PostgreSQL, Redis and Prometheus are bound to 127.0.0.1 so a cloud VM never
# exposes them to the internet; reach them remotely through an SSH tunnel.
services:
  # =======================================================
  # 1. PostgreSQL 16 with pgvector extension
  # =======================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: voxa_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voxa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voxa-network

  # =======================================================
  # 2. Redis 7 (In-Memory Streams & Semantic Cache)
  # =======================================================
  redis:
    image: redis:7-alpine
    container_name: voxa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voxa-network

  # =======================================================
  # 3. Schema migrations (Alembic): run once, then exit, before the gateway and workers
  # =======================================================
  migrate:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.gateway
    container_name: voxa-migrate
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voxa_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 3b. FastAPI Edge Gateway & WebSocket Ingress
  # =======================================================
  gateway:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.gateway
    container_name: voxa-gateway
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voxa_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-adminpassword123}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 4. Decoupled STT Worker (Faster-Whisper INT8)
  # =======================================================
  stt-worker:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.worker
    container_name: voxa-stt-worker
    restart: unless-stopped
    command: ["python", "-m", "workers.stt_worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STT_MODEL_SIZE=base
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 5. LLM Worker (answers voice transcripts with Gemini; metrics on :9100)
  # =======================================================
  llm-worker:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.worker
    container_name: voxa-llm-worker
    restart: unless-stopped
    command: ["python", "-m", "workers.llm_worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voxa_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 5b. Decoupled TTS Worker (edge-tts neural voice; needs internet access)
  # =======================================================
  tts-worker:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.worker
    container_name: voxa-tts-worker
    restart: unless-stopped
    command: ["python", "-m", "workers.tts_worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TTS_VOICE=en-US-AriaNeural
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 5c. Worker Supervisor (PEL crash recovery + dead-letter routing)
  # =======================================================
  worker-supervisor:
    build:
      context: ./voxa-backend
      dockerfile: Dockerfile.worker
    container_name: voxa-worker-supervisor
    restart: unless-stopped
    command: ["python", "-m", "workers.worker_supervisor"]
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voxa-network

  # =======================================================
  # 6. Next.js 14 Frontend Web UI
  # =======================================================
  frontend:
    build:
      context: ./voxa-frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the JS bundle at BUILD time, so they must be
      # build args; setting them as runtime environment variables has no effect.
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8088}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    container_name: voxa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - voxa-network

  # =======================================================
  # 7. Prometheus Telemetry Exporter
  # =======================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: voxa-prometheus
    restart: unless-stopped
    volumes:
      - ./voxa-backend/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - voxa-network

volumes:
  postgres_data:
  redis_data:

networks:
  voxa-network:
    driver: bridge
