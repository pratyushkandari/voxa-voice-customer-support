name: CI

# Every push (main and feature branches) is checked; a pull request shows the result of
# the push run for its head commit.
on: push

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels older runs on branches, but never a deploy in progress on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxa-backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voxa_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voxa-backend/requirements.txt
      - name: Install dependencies
        # CPU-only torch first; otherwise sentence-transformers pulls the 2.8 GB CUDA build.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: >-
          pytest -q --junitxml=reports/junit.xml
          --cov=app --cov=workers --cov-report=term --cov-report=xml:reports/coverage.xml
      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: voxa-backend/reports/
      - name: Migrations apply cleanly and match the models
        run: |
          python -m app.migrate
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxa-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voxa-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    # Pushes to main go live once both test jobs pass. The server only lets this key run
    # its deploy command, scripts/deploy.sh (see docs/RUNBOOK.md).
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST is not set, so there is nothing to deploy to."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "azureuser@$DEPLOY_HOST"
