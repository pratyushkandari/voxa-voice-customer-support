# Alembic configuration. The database URL comes from app.config (DATABASE_URL), not
# from this file. Apply migrations with `python -m app.migrate`.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# Lets migrations/env.py import the app package when run as the `alembic` command.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
