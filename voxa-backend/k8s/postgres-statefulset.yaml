apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voxa-postgres
spec:
  serviceName: voxa-postgres
  replicas: 1
  selector:
    matchLabels:
      app: voxa-postgres
  template:
    metadata:
      labels:
        app: voxa-postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: voxa_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voxa-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voxa-postgres
spec:
  selector:
    app: voxa-postgres
  ports:
  - port: 5432
    targetPort: 5432
