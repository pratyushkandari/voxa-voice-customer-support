---
# Single supervisor: reclaims tasks stranded by crashed workers and dead-letters poison messages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-worker-supervisor
  labels:
    app: voxa-worker-supervisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voxa-worker-supervisor
  template:
    metadata:
      labels:
        app: voxa-worker-supervisor
    spec:
      containers:
      - name: supervisor
        image: voxa/worker:2.0.0
        command: ["python", "-m", "workers.worker_supervisor"]
        envFrom:
        - configMapRef:
            name: voxa-config
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
