apiVersion: v1
kind: ConfigMap
metadata:
  name: voxa-config
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@voxa-postgres:5432/voxa_db"
  REDIS_URL: "redis://redis:6379/0"
  LLM_MODEL_NAME: "Qwen/Qwen2.5-0.5B-Instruct"
  STT_MODEL_SIZE: "base"
  TTS_VOICE: "en-US-AriaNeural"
---
# Placeholder values only. Never commit real secrets: create the Secret out-of-band, e.g.
#   kubectl create secret generic voxa-secrets \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD='<db-password>' \
#     --from-literal=SEED_ADMIN_PASSWORD='<admin-password>'
# All gateway replicas must share the same JWT_SECRET_KEY or tokens will fail across pods.
apiVersion: v1
kind: Secret
metadata:
  name: voxa-secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_WITH_openssl_rand_hex_32"
  POSTGRES_PASSWORD: "postgres"
  SEED_ADMIN_PASSWORD: "REPLACE_ME"
