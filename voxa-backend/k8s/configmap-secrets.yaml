apiVersion: v1
kind: ConfigMap
metadata:
  name: voxa-config
data:
  ENVIRONMENT: "production"
  REDIS_URL: "redis://redis:6379/0"
  LLM_MODEL_NAME: "Qwen/Qwen2.5-0.5B-Instruct"
  STT_MODEL_SIZE: "base"
  TTS_VOICE: "en-US-AriaNeural"
# The Secret is deliberately NOT defined in this directory: `kubectl apply -f k8s/` would
# otherwise overwrite the real values with placeholders. Create it once, out-of-band, before
# applying the manifests. DATABASE_URL lives here (not in the ConfigMap) because it embeds the
# database password and must change together with POSTGRES_PASSWORD:
#
#   DB_PASSWORD="$(openssl rand -hex 16)"
#   kubectl create secret generic voxa-secrets \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://postgres:${DB_PASSWORD}@voxa-postgres:5432/voxa_db" \
#     --from-literal=SEED_ADMIN_PASSWORD='<admin-password>'
#
# All gateway replicas must share the same JWT_SECRET_KEY or tokens will fail across pods.
