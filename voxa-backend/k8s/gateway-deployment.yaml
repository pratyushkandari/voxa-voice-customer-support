apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-gateway
  labels:
    app: voxa-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voxa-gateway
  template:
    metadata:
      labels:
        app: voxa-gateway
    spec:
      containers:
      - name: gateway
        image: voxa/gateway:2.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: voxa-config
        - secretRef:
            name: voxa-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
